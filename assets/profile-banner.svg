    <text x="60" y="366" fill="#72D6B2" font-size="60" font-weight="760">and platforms.</text>
    <text x="64" y="414" fill="#9CA6AF" font-size="18">Senior Full-Stack Engineer  ·  Technical Advisor  ·  Hands-on Builder</text>
  </g>

