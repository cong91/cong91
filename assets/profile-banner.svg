<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cong Nguyen Thanh — Engineering across systems, products and platforms</title>
  <desc id="desc">Senior Full-Stack Engineer and Technical Advisor with more than ten years of experience.</desc>
  <defs>
    <linearGradient id="surface" x1="80" y1="24" x2="1190" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171B20"/>
      <stop offset="1" stop-color="#0B0E11"/>
    </linearGradient>
    <radialGradient id="signal" cx="0" cy="0" r="1" gradientTransform="translate(1060 100) rotate(132) scale(490 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72D6B2" stop-opacity=".16"/>
      <stop offset="1" stop-color="#72D6B2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="20" fill="url(#surface)"/>
