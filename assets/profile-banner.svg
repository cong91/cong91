<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Cong Nguyen Thanh — Senior software engineer</title>
  <desc id="description">An editorial profile poster for Cong Nguyen Thanh, a senior full-stack engineer and technical advisor.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.65" fill="#1E2321" fill-opacity="0.07" />
      <circle cx="13" cy="12" r="0.45" fill="#1E2321" fill-opacity="0.05" />
    </pattern>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>
  <rect width="1280" height="560" rx="12" fill="#ECE9E1" />
  <rect width="1280" height="560" rx="12" fill="url(#paper)" />
  <rect x="1" y="1" width="1278" height="558" rx="11" stroke="#1E2321" stroke-opacity="0.12" stroke-width="2" />

  <path d="M774 0H1280V560H774Z" fill="#1E2321" />
  <circle cx="1106" cy="136" r="180" fill="#B6432E" fill-opacity="0.62" filter="url(#soften)" />
  <path d="M806 423C884 362 963 382 1044 293C1112 218 1194 214 1279 170" stroke="#ECE9E1" stroke-opacity="0.3" stroke-width="2" />
  <path d="M796 462C879 392 969 429 1052 331C1126 244 1206 246 1279 207" stroke="#ECE9E1" stroke-opacity="0.16" stroke-width="2" />

  <g fill="#1E2321">
    <text x="66" y="64" font-family="Trebuchet MS, Verdana, sans-serif" font-size="14" font-weight="700" letter-spacing="2.8">CONG NGUYEN THANH</text>
    <rect x="66" y="86" width="74" height="5" fill="#B6432E" />
    <text x="62" y="194" font-family="Georgia, 'Times New Roman', serif" font-size="69" font-weight="700">I build the systems</text>
    <text x="62" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="69" font-weight="700">behind the product.</text>
    <text x="66" y="325" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" fill="#4B514D">Senior Full-Stack Engineer · Technical Advisor</text>
    <text x="66" y="358" font-family="Trebuchet MS, Verdana, sans-serif" font-size="18" fill="#4B514D">From ambitious product briefs to software a team can run with confidence.</text>
    <text x="66" y="492" font-family="Trebuchet MS, Verdana, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">HO CHI MINH CITY · 10+ YEARS IN SOFTWARE</text>
  </g>

  <g fill="#ECE9E1">
    <text x="832" y="86" font-family="Trebuchet MS, Verdana, sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">FIELD NOTES / 01</text>
    <text x="832" y="147" font-family="Georgia, 'Times New Roman', serif" font-size="30">Product systems</text>
    <text x="832" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="30">AI tooling</text>
    <text x="832" y="229" font-family="Georgia, 'Times New Roman', serif" font-size="30">Cloud platforms</text>
    <text x="832" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="30">Mobile &amp; native</text>
    <rect x="832" y="329" width="340" height="1" fill="#ECE9E1" fill-opacity="0.45" />
    <text x="832" y="365" font-family="Trebuchet MS, Verdana, sans-serif" font-size="16" fill="#ECE9E1" fill-opacity="0.82">Architecture is only useful when</text>
    <text x="832" y="389" font-family="Trebuchet MS, Verdana, sans-serif" font-size="16" fill="#ECE9E1" fill-opacity="0.82">the team can build, test, and ship it.</text>
    <text x="832" y="492" font-family="Trebuchet MS, Verdana, sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">GITHUB.COM/CONG91</text>
  </g>
